apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops_ols_k8s
  namespace: devops_ols

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuario
  namespace: devops_ols
  labels:
    app: usuario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuario
  template:
    metadata:
      labels:
        app: usuario
        version: v1
    spec:
      serviceAccountName: devops_ols_k8s
      containers:
        - name: contenedor_usuario
          image: ghcr.io/lucianoescalona/usuario:1.0
          ports:
            - containerPort: 8080
          env:
            - name: VERSION
              value: "v1"
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              value: root
            - name: DB_NAME
              value: devops_db
          readinessProbe:
            httpGet:
              path: /api/v1/usuario/list
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: "1"

---

apiVersion: v1
kind: Service
metadata:
  name: usuario
  namespace: devops_ols
spec:
  type: ClusterIP
  selector:
    app: usuario
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: producto
  namespace: devops_ols
  labels:
    app: producto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producto
  template:
    metadata:
      labels:
        app: producto
        version: v1
    spec:
      serviceAccountName: devops_ols_k8s
      containers:
        - name: contenedor_producto
          image: ghcr.io/lucianoescalona/producto:1.0
          ports:
            - containerPort: 8081
          env:
            - name: VERSION
              value: "v1"
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              value: root
            - name: DB_NAME
              value: devops_db
          readinessProbe:
            httpGet:
              path: /api/v1/producto/list
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: "1"

---

apiVersion: v1
kind: Service
metadata:
  name: producto
  namespace: devops_ols
spec:
  type: ClusterIP
  selector:
    app: producto
  ports:
    - name: http
      port: 8081
      targetPort: 8081

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops_ols
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      serviceAccountName: devops_ols_k8s
      containers:
        - name: contenedor_frontend
          image: ghcr.io/lucianoescalona/frontend:1.0
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: "1"

---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devops_ols
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80