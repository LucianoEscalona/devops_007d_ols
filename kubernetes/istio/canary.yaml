apiVersion: v2
kind: ServiceAccount
metadata:
  name: devops_ols_k8s_v2
  namespace: devops_ols_v2

---

apiVersion: apps/v2
kind: Deployment
metadata:
  name: usuario
  namespace: devops_ols_v2
  labels:
    app: usuario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuario
  template:
    metadata:
      labels:
        app: usuario
        version: v2
    spec:
      serviceAccountName: devops_ols_k8s_v2
      containers:
        - name: contenedor_usuario_v2
          image: ghcr.io/lucianoescalona/usuario:1.0
          ports:
            - containerPort: 8080
          env:
            - name: VERSION
              value: "v2"
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              value: root
            - name: DB_NAME
              value: devops_db
          readinessProbe:
            httpGet:
              path: /api/v2/usuario/list
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: "1"

---

apiVersion: v2
kind: Service
metadata:
  name: usuario
  namespace: devops_ols_v2
spec:
  type: ClusterIP
  selector:
    app: usuario
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---

apiVersion: apps/v2
kind: Deployment
metadata:
  name: producto
  namespace: devops_ols_v2
  labels:
    app: producto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producto
  template:
    metadata:
      labels:
        app: producto
        version: v2
    spec:
      serviceAccountName: devops_ols_k8s_v2
      containers:
        - name: contenedor_producto_v2
          image: ghcr.io/lucianoescalona/producto:1.0
          ports:
            - containerPort: 8081
          env:
            - name: VERSION
              value: "v2"
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              value: root
            - name: DB_NAME
              value: devops_db
          readinessProbe:
            httpGet:
              path: /api/v2/producto/list
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: "1"

---

apiVersion: v2
kind: Service
metadata:
  name: producto
  namespace: devops_ols_v2
spec:
  type: ClusterIP
  selector:
    app: producto
  ports:
    - name: http
      port: 8081
      targetPort: 8081

---

apiVersion: apps/v2
kind: Deployment
metadata:
  name: frontend
  namespace: devops_ols_v2
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v2
    spec:
      serviceAccountName: devops_ols_k8s_v2
      containers:
        - name: contenedor_frontend_v2
          image: ghcr.io/lucianoescalona/frontend:1.0
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: "1"

---

apiVersion: v2
kind: Service
metadata:
  name: frontend
  namespace: devops_ols_v2
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devops_ols_route_v2
  namespace: devops_ols_v2
spec:
  parentRefs:
    - name: bookinfo-gateway_v2
      namespace: default
      sectionName: http
  # hostnames:
  #   - api.midominio.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/usuario
      backendRefs:
        - name: usuario
          port: 8080

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/producto
      backendRefs:
        - name: producto
          port: 8081