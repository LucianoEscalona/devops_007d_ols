name: Pipeline 01

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  
  instalacion-backend-producto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v6

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: './producto/pom.xml'

      - name: Ejecutar Tests y Compilar Backend producto
        run: |
          cd ./producto
          chmod +x mvnw || true
          ./mvnw clean compile -DskipTests

  instalacion-backend-usuario:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v6

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: './usuario/pom.xml'

      - name: Ejecutar Tests y Compilar Backend usuario
        run: |
          cd ./usuario
          chmod +x mvnw || true
          ./mvnw clean compile -DskipTests

  instalacion-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias y Validar frontend
        run: |
          cd ./frontend
          npm install
          npm run lint