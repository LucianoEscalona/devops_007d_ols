name: Pipeline 01

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  
  instalacion-backend-producto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v6

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: './producto/pom.xml'

      - name: Ejecutar Tests y Compilar Backend producto
        run: |
          cd ./producto
          chmod +x mvnw || true
          ./mvnw clean verify 

      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-producto
          path: ./producto/target/site/jacoco
          if-no-files-found: warn

  instalacion-backend-usuario:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v6

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: './usuario/pom.xml'

      - name: Ejecutar Tests y Compilar Backend usuario
        run: |
          cd ./usuario
          chmod +x mvnw || true
          ./mvnw clean verify  
          
      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-usuario
          path: ./usuario/target/site/jacoco
          if-no-files-found: warn

  instalacion-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependencias y Validar frontend
        run: |
          cd ./frontend
          npm ci
          npm run lint