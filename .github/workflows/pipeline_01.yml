name: Pipeline 01

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

jobs:
  
  instalacion-backend-producto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v6

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: './producto/pom.xml'

      - name: Ejecutar Tests y Compilar Backend producto
        run: |
          cd ./producto
          chmod +x mvnw || true
          ./mvnw clean verify 

      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-producto
          path: ./producto/target/site/jacoco
          if-no-files-found: warn

  instalacion-backend-usuario:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v6

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: './usuario/pom.xml'

      - name: Ejecutar Tests y Compilar Backend usuario
        run: |
          cd ./usuario
          chmod +x mvnw || true
          ./mvnw clean verify  
          
      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-usuario
          path: ./usuario/target/site/jacoco
          if-no-files-found: warn

  instalacion-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependencias y Validar frontend
        run: |
          cd ./frontend
          npm ci
          npm run lint

  snyk-scan:
    name: Snyk - ${{ matrix.project }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Producto
            directory: producto
            manifest: pom.xml

          - project: Usuario
            directory: usuario
            manifest: pom.xml

          - project: Frontend
            directory: frontend
            manifest: package.json

    steps:
      - name: Checkout del código
        uses: actions/checkout@v6

      - name: Configurar Java para resolver dependencias Maven
        if: matrix.manifest == 'pom.xml'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ matrix.directory }}/pom.xml

      - name: Configurar Node.js
        if: matrix.manifest == 'package.json'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instalar Snyk CLI
        run: npm install -g snyk

        
      - name: Resolver dependencias Maven
        if: matrix.manifest == 'pom.xml'
        working-directory: ${{ matrix.directory }}
        run: |
          chmod +x mvnw || true
          ./mvnw -B -DskipTests dependency:resolve

      - name: Instalar dependencias del Frontend
        if: matrix.manifest == 'package.json'
        working-directory: frontend
        run: npm ci
      
      - name: Analizar dependencias y generar reporte JSON
        id: snyk_test
        continue-on-error: true
        working-directory: ${{ matrix.directory }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file="${{ matrix.manifest }}" \
            --severity-threshold=high \
            --json-file-output=snyk-report.json \
            -d

      - name: Subir reporte Snyk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report-${{ matrix.directory }}
          path: ${{ matrix.directory }}/snyk-report.json
          if-no-files-found: warn

  sonar-scan-producto:
    name: SonarCloud - Producto
    runs-on: ubuntu-latest
    needs: instalacion-backend-producto
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: producto/pom.xml

      
      - name: Analizar con SonarCloud
        working-directory: ./producto
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw || true
          ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=lucianoescalona_devops_007d_ols_PRODUCTO \
            -Dsonar.organization=lucianoescalona \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  sonar-scan-usuario:
    name: SonarCloud - Usuario
    runs-on: ubuntu-latest
    needs: instalacion-backend-usuario
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: usuario/pom.xml

      
      - name: Analizar con SonarCloud
        working-directory: ./usuario
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw || true
          ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=lucianoescalona_devops_007d_ols_USUARIO \
            -Dsonar.organization=lucianoescalona \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  sonar-scan-frontend:
    name: SonarCloud - Frontend
    runs-on: ubuntu-latest
    needs: instalacion-frontend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=lucianoescalona_devops_007d_ols_FRONTEND
            -Dsonar.organization=lucianoescalona
            -Dsonar.host.url=https://sonarcloud.io
